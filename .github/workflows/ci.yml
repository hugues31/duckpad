name: Validate Duckpad
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run ty check --python-version ${{ matrix.python }}
      - run: uv run pytest -q

  typing-policy:
    name: Python typing exceptions may only shrink
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compare typing exceptions with the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_typing_policy.py

  windows-projects:
    name: Windows projects and trusted local execution
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --python 3.12
      - run: uv run pytest -q tests/test_project_paths.py tests/test_trusted_local.py

  browser:
    name: Frontend, browser tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --python 3.12
      - run: npm ci --prefix frontend
      - run: npm run format:check --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run check:i18n --prefix frontend
      - run: npm run test:unit --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm exec --prefix frontend -- playwright install --with-deps chromium
      - run: npm run test:e2e --prefix frontend
      # uv builds the wheel from the sdist, checking that the source archive is complete.
      - run: uv build
      - name: Run tests from the source archive
        run: |
          archive_tests="$(mktemp -d)"
          tar -xzf dist/duckpad-*.tar.gz --strip-components=1 -C "$archive_tests"
          export PATH="$PWD/.venv/bin:$PATH"
          cd "$archive_tests"
          PYTHONPATH="$PWD/src" python -m pytest -q
      - name: Smoke test the installed wheel outside the checkout
        run: |
          uv venv /tmp/duckpad-smoke --python 3.12
          uv pip install --python /tmp/duckpad-smoke/bin/python dist/*.whl
          uv run python scripts/smoke_wheel.py --python /tmp/duckpad-smoke/bin/python
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-diagnostics
          path: frontend/test-results/
