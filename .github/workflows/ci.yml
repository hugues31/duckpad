name: Validate Duckpad
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Every commit merged into main gets a result; a new push only supersedes a pull request run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run ty check --python-version ${{ matrix.python }}
      - name: Run Python tests
        if: matrix.python != '3.12'
        run: uv run pytest -q -n 4 --dist worksteal --durations=30
      - name: Check documentation examples omitted from the archive
        if: matrix.python == '3.12'
        run: uv run pytest -q tests/test_database_connections.py::test_published_examples_are_valid_definitions_shown_in_the_guide
      # Python 3.12 exercises the same suite from the archive instead of running it twice.
      - uses: ./.github/actions/setup-frontend
        if: matrix.python == '3.12'
      - if: matrix.python == '3.12'
        run: npm run build --prefix frontend
      # uv builds the wheel from the sdist, checking that the source archive is complete.
      - if: matrix.python == '3.12'
        run: uv build
      - name: Run tests from the source archive
        if: matrix.python == '3.12'
        run: |
          archive_tests="$(mktemp -d)"
          tar -xzf dist/duckpad-*.tar.gz --strip-components=1 -C "$archive_tests"
          export PATH="$PWD/.venv/bin:$PATH"
          cd "$archive_tests"
          PYTHONPATH="$PWD/src" python -m pytest -q -n 4 --dist worksteal --durations=30
      - name: Smoke test the installed wheel outside the checkout
        if: matrix.python == '3.12'
        run: |
          uv venv /tmp/duckpad-smoke --python 3.12
          uv pip install --python /tmp/duckpad-smoke/bin/python dist/*.whl
          uv run python scripts/smoke_wheel.py --python /tmp/duckpad-smoke/bin/python

  typing-policy:
    name: Python typing exceptions may only shrink
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compare typing exceptions with the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_typing_policy.py

  s3-acceptance:
    name: S3 storage acceptance on a Moto endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --python 3.12 --group integration
      # Downloads the httpfs extension matching DuckDB's PyPI wheel.
      - run: uv run --group integration python scripts/integration.py s3 --output s3-validation.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: s3-validation
          path: s3-validation.json
          if-no-files-found: ignore

  database-acceptance:
    name: Database acceptance on PostgreSQL, MySQL and SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: duckpad
          POSTGRES_PASSWORD: duckpad-ci-password
          POSTGRES_DB: sales_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U duckpad" --health-interval 5s --health-timeout 5s --health-retries 20
      # A MySQL schema is a database: dev and prod are two servers with the same database.
      mysql-dev:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: duckpad-ci-password
          MYSQL_DATABASE: duckpad
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pduckpad-ci-password" --health-interval 5s --health-timeout 5s --health-retries 30
      mysql-prod:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: duckpad-ci-password
          MYSQL_DATABASE: duckpad
        ports: ['3307:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pduckpad-ci-password" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DUCKPAD_POSTGRES_HOST: 127.0.0.1
      DUCKPAD_POSTGRES_PORT: '5432'
      DUCKPAD_POSTGRES_USER: duckpad
      DUCKPAD_POSTGRES_PASSWORD: duckpad-ci-password
      DUCKPAD_POSTGRES_DEV_DATABASE: sales_dev
      DUCKPAD_POSTGRES_PROD_DATABASE: sales_prod
      DUCKPAD_MYSQL_HOST: 127.0.0.1
      DUCKPAD_MYSQL_DEV_PORT: '3306'
      DUCKPAD_MYSQL_PROD_PORT: '3307'
      DUCKPAD_MYSQL_USER: root
      DUCKPAD_MYSQL_PASSWORD: duckpad-ci-password
      DUCKPAD_MYSQL_DATABASE: duckpad
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --python 3.12
      - run: PGPASSWORD=duckpad-ci-password psql -h 127.0.0.1 -U duckpad -d sales_dev -c 'CREATE DATABASE sales_prod'
      # Downloads the postgres, mysql and sqlite extensions matching DuckDB's PyPI wheel.
      - run: uv run python scripts/integration.py postgres --output database-validation/postgres.json
      - run: uv run python scripts/integration.py mysql --output database-validation/mysql.json
      - run: uv run python scripts/integration.py sqlite --output database-validation/sqlite.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: database-validation
          path: database-validation/
          if-no-files-found: ignore

  windows-projects:
    name: Windows projects and trusted local execution
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --python 3.12
      - run: uv run pytest -q tests/test_project_paths.py tests/test_trusted_local.py tests/test_python_nodes.py tests/test_python_environment.py tests/test_python_worker.py

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - run: npm run format:check --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run check:i18n --prefix frontend
      - run: npm run test:unit --prefix frontend
      - run: npm run build --prefix frontend

  browser:
    name: Browser shard ${{ matrix.shard }}/6
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-frontend
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --python 3.12
      - run: npm run build --prefix frontend
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('frontend/package-lock.json') }}
      # The runner supplies Chromium's libraries; these tests do not compare font snapshots.
      # Keep one worker and one disposable server per shard to isolate shared instance settings.
      - run: npm exec --prefix frontend -- playwright install --only-shell chromium
      - run: npm run test:e2e --prefix frontend -- --shard=${{ matrix.shard }}/6
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-diagnostics-${{ matrix.shard }}
          path: frontend/test-results/
