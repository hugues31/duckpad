[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "duckpad"
version = "0.1.0"
description = "A local SQL canvas with reproducible execution and cell lineage"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["duckdb==1.5.5", "fastapi>=0.115", "uvicorn>=0.34", "sqlglot>=27", "pydantic>=2.10", "python-multipart>=0.0.20", "filelock>=3.18"]

[project.scripts]
duckpad = "duckpad.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.11", "build>=1.2", "huey>=2.5", "apscheduler>=3.11,<4", "sqlalchemy>=2"]
integration = ["oracledb>=3", "boto3>=1.38", "moto[server]>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/duckpad"]

[tool.hatch.build.hooks.custom]
path = "scripts/build_hook.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
