[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "duckpad"
version = "0.7.0"
description = "A local SQL canvas with reproducible execution and cell lineage"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["duckdb", "sql", "data-pipeline", "data-lineage", "etl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
dependencies = [
    "duckdb>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "sqlglot>=27",
    "pydantic>=2.10",
    "python-multipart>=0.0.20",
    "filelock>=3.18",
    "psutil>=7.2",
    # DuckDB needs pytz to return TIMESTAMP WITH TIME ZONE values to Python.
    "pytz>=2024.1",
    "authlib>=1.9.1,<2",
    "httpx2>=2.4,<3",
    "joserfc>=1.7.7,<2",
    # Ed25519 account keys and validation of trusted SSH host keys.
    "cryptography>=44",
    "sqlmodel>=0.0.48,<0.1",
    "alembic>=1.20,<2",
    "sqlalchemy>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/hugues31/duckpad"
Repository = "https://github.com/hugues31/duckpad"
Issues = "https://github.com/hugues31/duckpad/issues"
Changelog = "https://github.com/hugues31/duckpad/releases"

[project.scripts]
duckpad = "duckpad.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28",
    "ruff>=0.11",
    "git-cliff==2.14.2",
    "mypy==2.4.1",
    "types-psutil>=7.2",
]
integration = ["oracledb>=3", "boto3>=1.38", "moto[server]>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/duckpad"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/scripts/build_hook.py",
    "/scripts/release.py",
    "/cliff.toml",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.hatch.build.hooks.custom]
path = "scripts/build_hook.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
    "error",
    # Starlette's test client still relies on httpx; nothing to change on our side.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PIE", "RET", "SIM", "RUF", "FURB", "PERF", "PTH", "PT"]
ignore = ["E501", "PT018"]

[tool.mypy]
python_version = "3.11"
files = ["src/duckpad"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
# Transitional call boundaries into legacy services; remove entries as they gain annotations.
untyped_calls_exclude = [
    "duckpad.access",
    "duckpad.bundle",
    "duckpad.catalog",
    "duckpad.comparison",
    "duckpad.components",
    "duckpad.data_preparation",
    "duckpad.extensions",
    "duckpad.git.remote",
    "duckpad.git.workspace",
    "duckpad.materialize",
    "duckpad.merge",
    "duckpad.store",
    "duckpad.templates",
]

[[tool.mypy.overrides]]
module = [
    "duckpad.datasets",
    "duckpad.engine",
    "duckpad.execution.*",
    "duckpad.git.command",
    "duckpad.git.identity",
    "duckpad.projects",
    "duckpad.types",
]
# Equivalent to mypy 2.4.1 --strict. The shorthand enables flags globally,
# even inside an override, so list them here to keep legacy modules in base mode.
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["duckpad.app"]
disallow_untyped_defs = true

# Existing dynamic document/SQLModel code. Exact module names only: this list
# may shrink, never grow. CI compares these exceptions with the base branch.
[[tool.mypy.overrides]]
module = [
    "duckpad.archive",
    "duckpad.bundle",
    "duckpad.comparison",
    "duckpad.components",
    "duckpad.example",
    "duckpad.git.remote",
    "duckpad.git.workspace",
    "duckpad.materialize",
    "duckpad.merge",
    "duckpad.search",
    "duckpad.sql_worker",
    "duckpad.store",
    "duckpad.templates",
    "duckpad.trace.describe",
    "duckpad.trace.normalize",
    "duckpad.trace.set_operation",
]
ignore_errors = true

# Authlib does not ship typing metadata. Keep the exception scoped to this dependency.
[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true
